fatal.config_loading_failure=Не вдається завантажити файли конфігурації.\n\
   Переконайтеся, що Xenon Launcher має права на читання та запис до "%s" та файлів у ньому.\n\
   Для macOS спробуйте помістити Xenon кудись із дозволами, відмінними від "Робочий стіл", "Завантаження" та "Документи", і спробуйте знову.
fatal.config_loading_failure.unix=Xenon Launcher не зміг завантажити файл конфігурації, оскільки він був створений користувачем "%1$s".\n\
   Відкрийте Xenon як користувач root (не рекомендується) або виконайте наступну команду в терміналі, щоб змінити власника файлу конфігурації на поточного користувача:\n%2$s
fatal.mac_app_translocation=Xenon Launcher ізольовано до тимчасового каталогу ОС через механізми безпеки macOS.\n\
   Перемістіть Xenon в інший каталог перед спробою відкриття. Інакше ваші налаштування та ігрові дані можуть бути втрачені після перезавантаження.\n\
   Все одно продовжити?
fatal.migration_requires_manual_reboot=Xenon Launcher було оновлено. Перезапустіть лаунчер.
fatal.apply_update_failure=Вибачте, але Xenon Launcher не може оновитися автоматично.\n\
   Ви можете оновити вручну, завантаживши новішу версію лаунчера з %s.\n\
   Якщо проблема не зникає, подумайте про те, щоб повідомити нас про це.
fatal.apply_update_need_win7=Xenon Launcher не може автоматично оновитися на Windows XP/Vista. \n\
   Ви можете оновити вручну, завантаживши новішу версію лаунчера з %s.
fatal.samba=Якщо ви відкрили Xenon Launcher з мережевого диска Samba, деякі функції можуть не працювати. Спробуйте оновити вашу Java або перемістити лаунчер в інший каталог.
fatal.illegal_char=Ваш шлях користувача містить недопустимий символ "=". Ви не зможете використовувати authlib-injector або змінювати скін вашого автономного облікового запису.
fatal.unsupported_platform=Minecraft ще не повністю підтримується на вашій платформі, тому можливі відсутні функції або навіть неможливість запуску гри.\n\
   \n\
   Якщо ви не можете запустити Minecraft версії 1.17 і новіші, спробуйте змінити «Рендерер» на «Mesa LLVMpipe» у розділі «Глобальні/налаштування екземпляра → Розширені налаштування», щоб використовувати рендеринг через CPU для кращої сумісності.
fatal.unsupported_platform.loongarch=Xenon Launcher надав підтримку платформи Loongson.\n\
   Якщо у вас виникли проблеми під час гри, ви можете відвідати https://github.com/DeterMination-Wind/Xenon для отримання допомоги.
fatal.unsupported_platform.windows_arm64=Xenon Launcher надав нативну підтримку платформи Windows on Arm. Якщо у вас виникли проблеми під час гри, спробуйте запустити гру з Java на основі архітектури x86.\n\
   Якщо ви використовуєте платформу <b>Qualcomm</b>, вам може знадобитися встановити <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">Пакет сумісності OpenGL</a> перед грою.\n\
   Натисніть посилання, щоб перейти до Microsoft Store та встановити пакет сумісності.

