  ¿Todavía quieres continuar?
fatal.config_in_temp_dir=Estás abriendo Xenon Launcher en un directorio temporal. Tus ajustes y datos de juego pueden perderse.\n\
  Se recomienda trasladar el Xenon a otro lugar y reabrirlo.\n\
  ¿Todavía quieres continuar?
fatal.config_loading_failure=No se pueden cargar los archivos de configuración.\n\
  Por favor, asegúrese de que Xenon Launcher tiene acceso de lectura y escritura a «%s» y a los archivos que contiene.\n\
  Para macOS, intente colocar Xenon en un lugar con permiso que no sea «Escritorio», «Descargas» y «Documentos» y vuelva a intentarlo.
fatal.config_loading_failure.unix=No se pudo cargar el archivo de configuración porque fue creado por el usuario «%1$s».\n\
  Por favor, abra Xenon como usuario root (no recomendado), o ejecute el siguiente comando en el terminal para cambiar la propiedad del archivo de configuración al usuario actual:\n%2$s
fatal.config_unsupported_version=El archivo de configuración actual fue creado por una versión más reciente del lanzador, y esta versión del lanzador no puede cargarlo correctamente.\n\
  Por favor, actualice y reinicie el lanzador.\n\
  Antes de actualizar el lanzador, cualquier configuración que modifiques no se guardará.
fatal.mac_app_translocation=El sistema operativo aísla Xenon Launcher en un directorio temporal debido a los mecanismos de seguridad de macOS.\n\
  Por favor, mueve Xenon a un directorio diferente antes de intentar abrirlo. De lo contrario, tus ajustes y datos de juego podrían perderse tras reiniciar.\n\
  ¿Todavía quieres continuar?
fatal.migration_requires_manual_reboot=Xenon Launcher ha sido actualizado. Por favor, reinicie el launcher.
fatal.apply_update_failure=Lo sentimos, pero Xenon Launcher no puede actualizarse.\n\
  \n\
  Puedes actualizar manualmente descargando una versión más reciente del launcher desde %s.\n\
  Si el problema persiste, por favor considere reportarlo a nosotros.
fatal.apply_update_need_win7=Xenon Launcher no puede actualizarse automáticamente en Windows XP/Vista.\n\
  \n\
  Puedes actualizar manualmente descargando una versión más reciente del launcher desde %s.
fatal.deprecated_java_version=Xenon requerirá Java 17 o posterior para funcionar en el futuro, pero seguirá siendo compatible con el lanzamiento de juegos con Java 6~16.\n\
\n\
Se recomienda instalar la última versión de Java para garantizar el correcto funcionamiento de Xenon.\n\
\n\
Puedes conservar la versión antigua de Java. Xenon puede reconocer y gestionar varias versiones de Java y elegirá automáticamente la adecuada para usted en función de la versión del juego.
fatal.deprecated_java_version.update=Xenon requerirá Java 17 o posterior para funcionar en el futuro. Por favor, instalar la última versión de Java para asegurarse de que el lanzador puede completar la actualización.\n\
\n\
Puedes conservar la versión antigua de Java.\
Xenon puede reconocer y gestionar varias versiones de Java \
y elegirá automáticamente la adecuada para usted en función de la versión del juego.
fatal.deprecated_java_version.download_link=Descargar Java %d
fatal.samba=Si ha abierto Xenon Launcher desde una unidad de red Samba, es posible que algunas funciones no funcionen. Intenta actualizar tu Java o mover el launcher a otro directorio.
fatal.illegal_char=Su ruta de usuario contiene un carácter ilegal «=», por lo que algunas características podrían no funcionar correctamente.\n\
  Por ejemplo, no podrá utilizar authlib-injector o cambiar el skin de su cuenta offline.
fatal.unsupported_platform=Minecraft aún no es totalmente compatible con tu plataforma, por lo que es posible que falten funciones o incluso que no puedas iniciar el juego.\n\
   \n\
   Si no puedes iniciar Minecraft 1.17 y versiones posteriores, puedes intentar cambiar el «Renderizador» a «Mesa LLVMpipe» en «Configuración global/específica de la instancia → Configuración avanzada» para utilizar el renderizado por CPU y mejorar la compatibilidad.
fatal.unsupported_platform.loongarch=Xenon Launcher ha prestado apoyo a la plataforma Loongson.\n\
  Si tienes problemas al jugar, puedes visitar https://github.com/DeterMination-Wind/Xenon para obtener ayuda.
fatal.unsupported_platform.windows_arm64=Xenon Launcher ha proporcionado soporte nativo para la plataforma Windows en Arm. Si tiene problemas al jugar a un juego, intente iniciarlo con Java de arquitectura x86.\n\
  \n\
  Si utilizas la plataforma <b>Qualcomm</b>, es posible que tengas que instalar el <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">paquete de compatibilidad OpenGL</a> antes de jugar.\n\
  Haz clic en el enlace para ir a Microsoft Store e instalar el paquete de compatibilidad.

