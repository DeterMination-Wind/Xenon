name: 新功能 | Feature Request
description: 为 Xenon 提出新功能。| Suggest a new feature or enhancement for Xenon.
title: "[Feature] "
labels: enhancement
body:
- type: markdown
  attributes:
    value: |
      请确认 Issues 列表无重复的项目。
      Please make sure that no duplicate issues have already been submitted.
- type: textarea
  id: summary
  attributes:
    label: 概述 | Summary
    description: |
      请介绍你想加入的新功能，并说明它属于 Xenon 的哪一部分（如安装、Mod 管理、地图/蓝图、联机、服务端管理等）。
      Please describe the new feature and which part of Xenon it belongs to (e.g. installation, mod management, maps/schematics, netplay, server management).
  validations:
    required: true
- type: textarea
  id: reason
  attributes:
    label: 原因 | Reason
    description: |
      请描述该功能带来的好处及原因。
      Please describe why you want to add the feature or enhancement to Xenon.
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: 详情 | Description
    description: |
      在这里可以补充描述该功能的具体实现方式或建议。（可选）
      Describe implementation details or suggestions here. (Optional)
